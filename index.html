<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BloxWorlds</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <img src="assets/icon.png" alt="">
        <span>BloxWorlds</span>
      </a>
      <a class="navlink active" href="index.html">Games</a>
      <a class="navlink" href="#" onclick="return false">Avatar</a>
      <a class="navlink" href="#" onclick="return false">Create</a>
      <div class="search"><span>🔍</span><input placeholder="Search" disabled></div>
      <div class="nav-user" id="navuser"></div>
    </div>
  </nav>

  <div class="wrap">
    <div class="profile-card">
      <div id="avprev"></div>
      <div class="profile-info">
        <input id="uname" maxlength="20" placeholder="Username" spellcheck="false">
        <div class="stats" id="stats"></div>
      </div>
      <button class="btn ghost" id="randlook">🎲 Randomize</button>
    </div>

    <div class="sort-row">
      <h2>Recommended For You</h2>
      <a class="seeall" href="#" onclick="return false">See All</a>
    </div>
    <div class="games">
      <a class="gcard" id="playObby" href="obby.html">
        <div class="thumb"><img src="assets/obby.png" alt="Mega Obby"></div>
        <div class="gtitle">Mega Obby</div>
        <div class="gmeta"><span class="up">👍 94%</span><span class="playing" id="playingCt">👤 P2P</span></div>
      </a>
      <div class="gcard soon"><div class="thumb dim"></div><div class="gtitle">Coming soon…</div><div class="gmeta"><span class="up">—</span></div></div>
      <div class="gcard soon"><div class="thumb dim"></div><div class="gtitle">Coming soon…</div><div class="gmeta"><span class="up">—</span></div></div>
      <div class="gcard soon"><div class="thumb dim"></div><div class="gtitle">Coming soon…</div><div class="gmeta"><span class="up">—</span></div></div>
    </div>

    <div class="note">
      Multiplayer is fully <b>peer-to-peer</b> (WebRTC) — no servers. Open the same game on two
      devices and you'll meet each other in-game automatically. Mobile supported. 📱
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "./vendor/three.min.js", "trystero/nostr": "./vendor/trystero-nostr.min.js" } }
  </script>
  <script type="module" src="js/hub.js"></script>
</body>
</html>
