<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mega Obby - BloxWorlds</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="game">
  <canvas id="c"></canvas>

  <div id="hud"></div>
  <div id="conn" class="off">● Connecting…</div>
  <div id="msg"></div>

  <div id="chat">
    <div id="chatlog"></div>
    <input id="chatin" maxlength="140" placeholder="Say something… (Enter to send, Esc to close)">
  </div>

  <div id="help">
    WASD / arrows — move &nbsp;•&nbsp; Space — jump<br>
    Drag mouse — camera &nbsp;•&nbsp; Scroll — zoom<br>
    Enter — chat &nbsp;•&nbsp; R — respawn<br>
    <a href="index.html" style="color:#8ecbff;pointer-events:auto">← Back to BloxWorlds</a>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/obby.js"></script>
</body>
</html>
